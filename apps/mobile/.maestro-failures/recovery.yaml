# Dedicated empty demo QA installation and EXPO_PUBLIC_DEMO_FAILURE_PLAN:
# load:offline,search:offline,search:timeout,search:slow,save:storage,save:slow,share:timeout,share:slow
appId: ${APP_ID}
name: Recover loading, search, place save and share failures
---
- launchApp
- assertVisible: 기록을 불러오지 못했어요
- tapOn:
    id: request-retry
- tapOn:
    id: welcome-start
- tapOn:
    id: add-place
- tapOn: 부산
- assertVisible: 장소를 불러오지 못했어요
- assertVisible: 연결이 끊겼어요.*
- assertVisible:
    id: place-search-query
    text: 부산
- assertNotVisible: 일치하는 예시 장소가 없어요
- takeScreenshot: search-offline
- tapOn:
    id: request-retry
- assertVisible: 응답이 늦어졌어요.*
- tapOn:
    id: request-retry
- scrollUntilVisible:
    element:
      id: search-result-demo-busan-coffee
    direction: DOWN
- tapOn:
    id: search-result-demo-busan-coffee
- scrollUntilVisible:
    element:
      id: place-note
    direction: DOWN
- tapOn:
    id: place-note
- inputText: First recovery draft
- hideKeyboard
- tapOn:
    id: place-save
- assertVisible: 아직 저장하지 못했어요
- assertVisible: 기기에 기록하지 못했어요.*
- takeScreenshot: place-save-failure
- scrollUntilVisible:
    element:
      id: place-note
    direction: DOWN
- assertVisible: First recovery draft
- tapOn:
    id: place-note
    point: "95%,85%"
- eraseText
- inputText: Edited after failure
- hideKeyboard
- tapOn:
    id: place-save
- assertNotVisible:
    id: place-editor
- tapOn:
    id: region-picker-open
- tapOn:
    id: region-kr
- tapOn:
    id: region-busan
- tapOn:
    id: region-apply
- scrollUntilVisible:
    element:
      id: saved-place-demo-busan-coffee
    direction: DOWN
- tapOn:
    id: saved-place-demo-busan-coffee
- scrollUntilVisible:
    element:
      id: place-note
    direction: DOWN
- assertVisible: Edited after failure
- tapOn:
    id: sheet-close
- scrollUntilVisible:
    element:
      id: create-share
    direction: UP
- tapOn:
    id: create-share
- tapOn:
    id: share-next
- tapOn:
    id: share-select-all
- tapOn:
    id: share-next
- tapOn:
    id: share-name
- inputText: Recovery share
- hideKeyboard
- scrollUntilVisible:
    element:
      id: share-consent
    direction: DOWN
- tapOn:
    id: share-consent
- tapOn:
    id: share-save
- assertVisible: 아직 저장하지 못했어요
- assertVisible: 응답이 늦어졌어요.*
- takeScreenshot: share-failure
- scrollUntilVisible:
    element:
      id: share-name
    direction: DOWN
- assertVisible: Recovery share
- scrollUntilVisible:
    element:
      id: share-consent
    direction: DOWN
- assertVisible:
    id: share-consent
    checked: true
- tapOn:
    id: share-save
- assertNotVisible:
    id: share-editor
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element: 공유 초안 관리
    direction: DOWN
- tapOn: 공유 초안 관리
- assertVisible: Recovery share
- takeScreenshot: recovery-complete
